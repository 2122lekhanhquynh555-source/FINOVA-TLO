services:
  - type: web
    name: finova
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false        # paste your Google AI Studio key in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
